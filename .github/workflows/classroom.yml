name: GitHub Classroom Workflow

on: [push]

jobs:
  build-linux:
    permissions: write-all
    name: Autograding
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Set PYTHONPATH to see project modules
      run: |
         echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV
    - name: Install dependencies
      run: |
        pip3 install -q -r .devcontainer/requirements.txt
    - name: Force Javascript 24
      run: |
         echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

    - name: Show Python versions
      id: show-python-versions
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Show Python versions'
        setup-command: ''
        command: 'python src/python_versions.py'
        timeout: '10'
        max-score: '0'

    - name: Test Assignment Notebook runs all cells cleanly
      id: test-assignment-notebook
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Assignment Notebook'
        working-directory: './notebooks'
        setup-command: ''
        command: 'jupyter nbconvert --execute Assg-02-Logistic-Regression-Gradient-Descent.ipynb --to notebook'
        timeout: '10'
        max-score: '20'

    - name: Task 1.1 test flatten_image_dataset()
      id: test-task-1-1
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 1.1'
        working-directory: './src'        
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_flatten_image_dataset'
        timeout: '10'
        max-score: '10'

    - name: Task 1.2 test standardize_image_dataset()
      id: test-task-1-2
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 1.2'
        working-directory: './src'        
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_standardize_image_dataset'
        timeout: '10'
        max-score: '10'

    - name: Task 2.1 test sigmoid()
      id: test-task-2-1
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 2.1'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_sigmoid'
        timeout: '10'
        max-score: '10'

    - name: Task 2.2 test initialize_parameters()
      id: test-task-2-2
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 2.2'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_initialize_parameters'
        timeout: '10'
        max-score: '10'

    - name: Task 2.3 test forward_pass()
      id: test-task-2-3
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 2.3'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_forward_pass'
        timeout: '10'
        max-score: '10'

    - name: Task 2.4 test backward_pass()
      id: test-task-2-4
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 2.4'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_backward_pass'
        timeout: '10'
        max-score: '10'

    - name: Task 2.5 test optimize()
      id: test-task-2-5
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 2.5'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_optimize'
        timeout: '10'
        max-score: '10'

    - name: Task 2.6 test predict()
      id: test-task-2-6
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 2.6'
        setup-command: ''
        command: 'python -m unittest test_assg_tasks.test_predict'
        timeout: '10'
        max-score: '10'

    - name: Autograding Reporter
      uses: education/autograding-grading-reporter@v1
      env:
        TEST-ASSIGNMENT-NOTEBOOK_RESULTS: "${{steps.test-assignment-notebook.outputs.result}}"
        TEST-TASK-1-1_RESULTS: "${{steps.test-task-1-1.outputs.result}}"
        TEST-TASK-1-2_RESULTS: "${{steps.test-task-1-2.outputs.result}}"
        TEST-TASK-2-1_RESULTS: "${{steps.test-task-2-1.outputs.result}}"
        TEST-TASK-2-2_RESULTS: "${{steps.test-task-2-2.outputs.result}}"
        TEST-TASK-2-3_RESULTS: "${{steps.test-task-2-3.outputs.result}}"
        TEST-TASK-2-4_RESULTS: "${{steps.test-task-2-4.outputs.result}}"
        TEST-TASK-2-5_RESULTS: "${{steps.test-task-2-5.outputs.result}}"
        TEST-TASK-2-6_RESULTS: "${{steps.test-task-2-6.outputs.result}}"
      with:
        runners: test-assignment-notebook,test-task-1-1,test-task-1-2,test-task-2-1,test-task-2-2,test-task-2-3,test-task-2-4,test-task-2-5,test-task-2-6
